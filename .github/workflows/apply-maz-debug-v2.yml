name: Apply MAZ Relapse debug v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-maz-debug-v2.yml'
      - '.github/scripts/apply_maz_debug.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_maz_debug.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/maz/maz-ui.js includes/js/index.js includes/js/index-legacy.js exploit.html includes/caches/manifest/1302-1352.manifest
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add MAZ Relapse stage debug"
          git push origin HEAD:main
